[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weir"
version = "1.0.0"
description = "High-throughput in-process event pipeline — the Python answer"
requires-python = ">=3.11"
# Zero runtime dependencies, deliberately. The whole argument is about what
# CPython itself does.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
weir-bench = "weir_bench.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weir", "src/weir_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "asyncio_compat: uses asyncio.run directly, no plugin needed",
    "slow: full C++-parity stress sizes; deselect with -m 'not slow'",
]
